# Keeps the public demo awake during judging: Render's free services sleep after 15 minutes without traffic, and a
# cold start takes most of a minute. Every 10 minutes this GETs the web app and the API. It stops by itself after
# 9 Nov 2026 23:59 UTC (the job checks the date and does nothing after that); delete this file to stop it sooner.
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stop after 9 Nov 2026 23:59 UTC
        id: window
        run: |
          now=$(date -u +%s)
          end=$(date -u -d "2026-11-09T23:59:59Z" +%s)
          if [ "$now" -gt "$end" ]; then
            echo "Past 9 Nov 2026 23:59 UTC: nothing to keep awake."
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi
      - name: GET the web app and the API
        if: steps.window.outputs.active == 'true'
        run: |
          for url in https://pheri-web.onrender.com https://pheri-api.onrender.com/health; do
            code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 90 --retry 2 --retry-delay 10 "$url")
            echo "$url -> $code"
            if [ "$code" -ge 400 ] || [ "$code" = "000" ]; then
              echo "::warning::$url answered $code"
            fi
          done
